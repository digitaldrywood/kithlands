name: Walking regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  visual-tests:
    name: visual-tests (${{ matrix.suite }})
    # Keep Playwright on a supported OS; ubuntu-latest now resolves to 26.04.
    runs-on: ubuntu-24.04
    # Keep movement, gameplay, interior, and campaign checks within independent job budgets.
    strategy:
      fail-fast: false
      matrix:
        suite: [walking, gameplay, interiors, campaign]
    timeout-minutes: 30
    env:
      PGHOST: localhost
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Prepare local database role
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -c "CREATE ROLE runner WITH LOGIN SUPERUSER"
      - name: Install client and browser
        working-directory: client
        run: |
          npm ci
          PLAYWRIGHT_BROWSERS_PATH="$PWD/tmp/ms-playwright" npx playwright install --with-deps chromium
      - name: Warm server build cache
        working-directory: server
        run: go build ./cmd/kithlands
      - name: Verify accepted walk assets
        run: |
          sha256sum --check docs/walk-assets.sha256
          python3 skills/kithlands-visual-production/scripts/audit_walk_sheets.py client/public/sprites/walk --columns 6 --rows 8 --mode enforce
      - name: Verify all-class walking and world rendering
        if: matrix.suite == 'walking'
        run: ./scripts/run_playwright_local.sh e2e/walk-rendered-cadence.spec.js e2e/walk-all-classes.spec.js e2e/world-space-cycle.spec.js e2e/world-walk-audit-party.spec.js e2e/world-terrain-visibility.spec.js
      - name: Verify battle controls, field magic, pacing, and adventure navigation
        if: matrix.suite == 'gameplay'
        run: ./scripts/run_playwright_local.sh e2e/battle-continuity.spec.js e2e/field-magic-repeat.spec.js e2e/battle-stop-auto.spec.js e2e/world-encounter-pacing.spec.js e2e/river-footbridges.spec.js e2e/adventure-map-navigation.spec.js e2e/heron-playability-loop.spec.js e2e/warrior-critical.spec.js e2e/battle-defend.spec.js e2e/battle-context-choices.spec.js e2e/enemy-tactics.spec.js e2e/opening-integration.spec.js e2e/shop-responsive.spec.js e2e/shop-buy-flow.spec.js e2e/shop-compare.spec.js e2e/shop-spell-learn.spec.js e2e/merchant-stock-authority.spec.js e2e/canonical-item-art.spec.js e2e/first-session-route.spec.js e2e/world-shop-entry.spec.js e2e/dev-artifact-isolation.spec.js
      - name: Verify natural campaign progression and quest recovery
        if: matrix.suite == 'campaign'
        run: ./scripts/run_playwright_local.sh e2e/campaign-first-level.spec.js
      - name: Verify complete interior library and playable entrances
        if: matrix.suite == 'interiors'
        run: ./scripts/run_playwright_local.sh e2e/interior-library-gallery.spec.js e2e/elder-house-visit.spec.js e2e/interior-door-access.spec.js e2e/interior-templates-proof.spec.js
      - name: Retain motion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-proof-${{ matrix.suite }}
          path: |
            client/tmp/walk-rendered-*/
            client/tmp/warrior-critical-*/
            client/tmp/battle-defend-*/
            client/tmp/enemy-tactics-*/
            client/tmp/opening-integration-*/
            client/tmp/first-session-*/
            client/tmp/campaign-first-level-*/
            client/tmp/world-shop-entry-*/
            client/tmp/dev-artifact-isolation-*/
            client/tmp/shop-responsive-*/
            client/tmp/modern-shop-*/
            client/tmp/canonical-art-*/
            client/tmp/merchant-stock-authority/proof/
            client/e2e/tmp/issue-202-*.png
            client/e2e/tmp/issue-204-*.png
            client/e2e/tmp/town-shared-journal-*.png
            client/test-results/
            client/tmp/interior-library-*/
            client/e2e/tmp/issue-224-*.png
            /tmp/kithlands-server-*.log
            /tmp/kithlands-client-*.log
          retention-days: 14

  # Preserve the protected check name; every suite must pass.
  walking:
    # Keep Playwright on a supported OS; ubuntu-latest now resolves to 26.04.
    runs-on: ubuntu-24.04
    needs: visual-tests
    if: ${{ always() }}
    steps:
      - name: Require every visual suite
        env:
          VISUAL_RESULT: ${{ needs.visual-tests.result }}
        run: test "$VISUAL_RESULT" = success
