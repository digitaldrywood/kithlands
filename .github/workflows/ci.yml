name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-and-data:
    runs-on: [self-hosted, linux, personal]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false
          cache-dependency-path: server/go.sum

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Build
        working-directory: server
        run: go build ./...

      - name: Test (race detection)
        working-directory: server
        run: go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.1.6
          working-directory: server
          args: --timeout=5m --allow-serial-runners

      - name: Balance sim smoke test
        working-directory: server
        run: go run ./cmd/balance_sim -battles=10 -shared=../shared

      - name: Validate shared JSON files
        run: |
          failed=0
          for f in $(find shared -name '*.json' -type f); do
            if ! python3 -c "import json, sys; json.load(open(sys.argv[1]))" "$f" 2>&1; then
              echo "FAIL: $f"
              failed=1
            else
              echo "OK: $f"
            fi
          done
          exit $failed

      - name: Validate shared/ gamedata semantics
        working-directory: server
        run: go run ./cmd/validate_gamedata -shared=../shared

  client:
    runs-on: [self-hosted, linux, personal]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        run: npm run build

      - name: Prettier check
        working-directory: client
        run: npx prettier --check --ignore-path .gitignore .

      - name: Audit dependencies
        working-directory: client
        run: npm audit --audit-level=moderate
        continue-on-error: true

  pr-size:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, personal]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check PR size
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          TOTAL=$(git diff --numstat origin/main...HEAD | awk '{ add += $1; del += $2 } END { print add + del }')
          echo "PR changes: $TOTAL lines"
          if [ "$TOTAL" -gt 500 ]; then
            EXISTING=$(gh pr view "$PR_NUMBER" --json comments --jq '.comments[].body' | grep -c "PR size warning" || true)
            if [ "$EXISTING" -eq 0 ]; then
              gh pr comment "$PR_NUMBER" --body "<!-- PR size warning -->**Warning:** This PR has $TOTAL lines changed (threshold: 500). Consider splitting into smaller PRs."
            fi
          fi
